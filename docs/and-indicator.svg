<svg xmlns="http://www.w3.org/2000/svg" width="680" height="378" viewBox="0 0 680 378" role="img"><title>AND gate on-track indicator</title><desc>The two sensor DO signals feed gate 1 of a 74LS08. The gate output drives a BC547 through 1 kilo-ohm, which switches an LED with a 330 ohm resistor from 5 V.</desc><defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#1f2328}
.th{font-size:14px;font-weight:600;fill:#1f2328}
.ts{font-size:12px;fill:#59636e}
.ti{font-size:16px;font-weight:600;fill:#1f2328}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.ghost{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:6 4}
.w{stroke:#444;stroke-width:1.5;fill:none}
.p{stroke:#D85A30;stroke-width:1.5;fill:none}
</style><rect x="0.5" y="0.5" width="679" height="377" rx="12" fill="#ffffff" stroke="#d0d7de"/><text class="ti" x="24" y="28">Optional add-on: AND-gate "on track" indicator</text><g transform="translate(0,44)"><rect class="teal" x="40" y="60" width="130" height="44" rx="8"/><text class="th" x="105.0" y="75" text-anchor="middle" dominant-baseline="central">DO_L</text><text class="ts" x="105.0" y="92" text-anchor="middle" dominant-baseline="central">left header pad</text><rect class="teal" x="40" y="130" width="130" height="44" rx="8"/><text class="th" x="105.0" y="145" text-anchor="middle" dominant-baseline="central">DO_R</text><text class="ts" x="105.0" y="162" text-anchor="middle" dominant-baseline="central">right header pad</text><line class="w" x1="170" y1="82" x2="208" y2="82" marker-end="url(#ag)"/><line class="w" x1="170" y1="152" x2="208" y2="152" marker-end="url(#ag)"/><rect class="teal" x="210" y="60" width="150" height="114" rx="8"/><text class="th" x="285" y="95" text-anchor="middle" dominant-baseline="central">74LS08</text><text class="ts" x="285" y="118" text-anchor="middle" dominant-baseline="central">gate 1</text><text class="ts" x="285" y="138" text-anchor="middle" dominant-baseline="central">pins 1, 2 in; 3 out</text><line class="w" x1="360" y1="117" x2="393" y2="117" marker-end="url(#ag)"/><rect class="gray" x="395" y="95" width="90" height="44" rx="8"/><text class="th" x="440.0" y="117.0" text-anchor="middle" dominant-baseline="central">1 kΩ</text><line class="w" x1="485" y1="117" x2="518" y2="117" marker-end="url(#ag)"/><rect class="gray" x="520" y="95" width="130" height="44" rx="8"/><text class="th" x="585.0" y="110" text-anchor="middle" dominant-baseline="central">BC547</text><text class="ts" x="585.0" y="127" text-anchor="middle" dominant-baseline="central">emitter to GND</text><line class="w" x1="585" y1="139" x2="585" y2="188" marker-end="url(#ag)"/><rect class="coral" x="520" y="190" width="130" height="44" rx="8"/><text class="th" x="585.0" y="205" text-anchor="middle" dominant-baseline="central">LED + 330 Ω</text><text class="ts" x="585.0" y="222" text-anchor="middle" dominant-baseline="central">anode to 5 V</text><line class="p" x1="585" y1="270" x2="585" y2="236" marker-end="url(#ap)"/><rect class="coral" x="520" y="270" width="130" height="44" rx="8"/><text class="th" x="585.0" y="292.0" text-anchor="middle" dominant-baseline="central">+5 V</text><rect class="ghost" x="40" y="210" width="260" height="44" rx="8"/><text class="th" x="170" y="225" text-anchor="middle" dominant-baseline="central">Chip power</text><text class="ts" x="170" y="242" text-anchor="middle" dominant-baseline="central">5 V on 14, GND on 7, 0.1 µF</text><rect class="ghost" x="40" y="270" width="260" height="44" rx="8"/><text class="th" x="170" y="285" text-anchor="middle" dominant-baseline="central">Unused inputs</text><text class="ts" x="170" y="302" text-anchor="middle" dominant-baseline="central">pins 4, 5, 9, 10, 12, 13 to GND</text></g></svg>