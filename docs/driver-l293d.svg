<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>L293D breakout wiring</title><desc>Battery plus on V+/Vcc, ground, the two IR sensor signals on A1 and B1, A2 and B2 on ground, the 555 PWM on ENA and ENB, and the two motors on OUT1 to OUT4.</desc><defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#1f2328}
.th{font-size:14px;font-weight:600;fill:#1f2328}
.ts{font-size:12px;fill:#59636e}
.ti{font-size:16px;font-weight:600;fill:#1f2328}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.ghost{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:6 4}
.w{stroke:#444;stroke-width:1.5;fill:none}
.p{stroke:#D85A30;stroke-width:1.5;fill:none}
</style><rect x="0.5" y="0.5" width="679" height="499" rx="12" fill="#ffffff" stroke="#d0d7de"/><text class="ti" x="24" y="28">L293D breakout: connections</text><g transform="translate(0,44)"><rect class="gray" x="250" y="40" width="180" height="396" rx="8"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">L293D breakout</text><rect class="coral" x="30" y="72" width="180" height="36" rx="8"/><text class="th" x="120" y="90" text-anchor="middle" dominant-baseline="central">Battery +</text><line class="p" x1="210" y1="90" x2="248" y2="90" marker-end="url(#ap)"/><text class="ts" x="258" y="90" text-anchor="start" dominant-baseline="central">V+ / Vcc</text><rect class="gray" x="30" y="116" width="180" height="36" rx="8"/><text class="th" x="120" y="134" text-anchor="middle" dominant-baseline="central">GND</text><line class="w" x1="210" y1="134" x2="248" y2="134" marker-end="url(#ag)"/><text class="ts" x="258" y="134" text-anchor="start" dominant-baseline="central">GND</text><rect class="teal" x="30" y="160" width="180" height="36" rx="8"/><text class="th" x="120" y="178" text-anchor="middle" dominant-baseline="central">DO_L (left IR)</text><line class="w" x1="210" y1="178" x2="248" y2="178" marker-end="url(#ag)"/><text class="ts" x="258" y="178" text-anchor="start" dominant-baseline="central">A1</text><rect class="gray" x="30" y="204" width="180" height="36" rx="8"/><text class="th" x="120" y="222" text-anchor="middle" dominant-baseline="central">GND</text><line class="w" x1="210" y1="222" x2="248" y2="222" marker-end="url(#ag)"/><text class="ts" x="258" y="222" text-anchor="start" dominant-baseline="central">A2</text><rect class="teal" x="30" y="248" width="180" height="36" rx="8"/><text class="th" x="120" y="266" text-anchor="middle" dominant-baseline="central">DO_R (right IR)</text><line class="w" x1="210" y1="266" x2="248" y2="266" marker-end="url(#ag)"/><text class="ts" x="258" y="266" text-anchor="start" dominant-baseline="central">B1</text><rect class="gray" x="30" y="292" width="180" height="36" rx="8"/><text class="th" x="120" y="310" text-anchor="middle" dominant-baseline="central">GND</text><line class="w" x1="210" y1="310" x2="248" y2="310" marker-end="url(#ag)"/><text class="ts" x="258" y="310" text-anchor="start" dominant-baseline="central">B2</text><rect class="teal" x="30" y="336" width="180" height="36" rx="8"/><text class="th" x="120" y="354" text-anchor="middle" dominant-baseline="central">555 pin 3 (PWM)</text><line class="w" x1="210" y1="354" x2="248" y2="354" marker-end="url(#ag)"/><text class="ts" x="258" y="354" text-anchor="start" dominant-baseline="central">ENA</text><rect class="teal" x="30" y="380" width="180" height="36" rx="8"/><text class="th" x="120" y="398" text-anchor="middle" dominant-baseline="central">555 pin 3 (PWM)</text><line class="w" x1="210" y1="398" x2="248" y2="398" marker-end="url(#ag)"/><text class="ts" x="258" y="398" text-anchor="start" dominant-baseline="central">ENB</text><text class="ts" x="422" y="90" text-anchor="end" dominant-baseline="central">OUT1</text><line class="w" x1="430" y1="90" x2="468" y2="90"/><text class="ts" x="422" y="134" text-anchor="end" dominant-baseline="central">OUT2</text><line class="w" x1="430" y1="134" x2="468" y2="134"/><text class="ts" x="422" y="178" text-anchor="end" dominant-baseline="central">OUT3</text><line class="w" x1="430" y1="178" x2="468" y2="178"/><text class="ts" x="422" y="222" text-anchor="end" dominant-baseline="central">OUT4</text><line class="w" x1="430" y1="222" x2="468" y2="222"/><rect class="gray" x="470" y="76" width="180" height="72" rx="8"/><text class="th" x="560.0" y="91" text-anchor="middle" dominant-baseline="central">Left motor</text><text class="ts" x="560.0" y="108" text-anchor="middle" dominant-baseline="central">OUT1, OUT2</text><rect class="gray" x="470" y="164" width="180" height="72" rx="8"/><text class="th" x="560.0" y="179" text-anchor="middle" dominant-baseline="central">Right motor</text><text class="ts" x="560.0" y="196" text-anchor="middle" dominant-baseline="central">OUT3, OUT4</text><rect class="ghost" x="470" y="270" width="180" height="110" rx="8"/><text class="th" x="560" y="288" text-anchor="middle" dominant-baseline="central">Shared supply node</text><text class="ts" x="560" y="312" text-anchor="middle" dominant-baseline="central">V+ and Vcc are one net</text><text class="ts" x="560" y="330" text-anchor="middle" dominant-baseline="central">on this breakout. Keep</text><text class="ts" x="560" y="348" text-anchor="middle" dominant-baseline="central">the 5 V rail off it.</text></g></svg>