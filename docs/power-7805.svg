<svg xmlns="http://www.w3.org/2000/svg" width="680" height="364" viewBox="0 0 680 364" role="img"><title>7805 power section</title><desc>7805 regulator with battery plus on pin 1, ground on pin 2 and the 5 V rail on pin 3, with the input and output capacitors. The rail feeds the IR modules and the 555.</desc><defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#1f2328}
.th{font-size:14px;font-weight:600;fill:#1f2328}
.ts{font-size:12px;fill:#59636e}
.ti{font-size:16px;font-weight:600;fill:#1f2328}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.ghost{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:6 4}
.w{stroke:#444;stroke-width:1.5;fill:none}
.p{stroke:#D85A30;stroke-width:1.5;fill:none}
</style><rect x="0.5" y="0.5" width="679" height="363" rx="12" fill="#ffffff" stroke="#d0d7de"/><text class="ti" x="24" y="28">5 V power section: 7805 pin connections</text><g transform="translate(0,44)"><rect class="teal" x="290" y="50" width="100" height="170" rx="8"/><text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">7805</text><text class="ts" x="340" y="198" text-anchor="middle" dominant-baseline="central">TO-220</text><line class="w" x1="270" y1="90" x2="290" y2="90"/><line class="w" x1="270" y1="146" x2="290" y2="146"/><line class="w" x1="390" y1="90" x2="410" y2="90"/><text class="ts" x="296" y="90" text-anchor="start" dominant-baseline="central">1 IN</text><text class="ts" x="296" y="146" text-anchor="start" dominant-baseline="central">2 GND</text><text class="ts" x="384" y="90" text-anchor="end" dominant-baseline="central">OUT 3</text><rect class="coral" x="30" y="68" width="185" height="44" rx="8"/><text class="th" x="122.5" y="83" text-anchor="middle" dominant-baseline="central">Battery +</text><text class="ts" x="122.5" y="100" text-anchor="middle" dominant-baseline="central">4.7 µF + 0.1 µF to GND</text><rect class="gray" x="30" y="124" width="185" height="44" rx="8"/><text class="th" x="122.5" y="139" text-anchor="middle" dominant-baseline="central">Battery −</text><text class="ts" x="122.5" y="156" text-anchor="middle" dominant-baseline="central">tab is also GND</text><line class="p" x1="215" y1="90" x2="270" y2="90"/><line class="w" x1="215" y1="146" x2="270" y2="146"/><rect class="coral" x="465" y="68" width="185" height="44" rx="8"/><text class="th" x="557.5" y="83" text-anchor="middle" dominant-baseline="central">+5 V rail</text><text class="ts" x="557.5" y="100" text-anchor="middle" dominant-baseline="central">10 µF + 0.1 µF to GND</text><line class="p" x1="410" y1="90" x2="465" y2="90"/><text class="ts" x="30" y="232" text-anchor="start" dominant-baseline="central">The 5 V rail feeds:</text><rect class="teal" x="30" y="250" width="190" height="44" rx="8"/><text class="th" x="125.0" y="265" text-anchor="middle" dominant-baseline="central">IR modules</text><text class="ts" x="125.0" y="282" text-anchor="middle" dominant-baseline="central">VCC, GND</text><rect class="teal" x="245" y="250" width="190" height="44" rx="8"/><text class="th" x="340.0" y="265" text-anchor="middle" dominant-baseline="central">555 timer</text><text class="ts" x="340.0" y="282" text-anchor="middle" dominant-baseline="central">pins 4 and 8</text><rect class="ghost" x="460" y="250" width="190" height="44" rx="8"/><text class="th" x="555" y="265" text-anchor="middle" dominant-baseline="central">Not on this rail</text><text class="ts" x="555" y="282" text-anchor="middle" dominant-baseline="central">L293D board (shared node)</text></g></svg>