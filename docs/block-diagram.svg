<svg xmlns="http://www.w3.org/2000/svg" width="680" height="556" viewBox="0 0 680 556" role="img"><title>Line follower car block diagram</title><desc>Battery and switch feed the perfboard (7805, 555 PWM, IR headers). Two IR modules plug into the perfboard. Battery plus, ground, the two sensor signals and the PWM go to the L293D board, which drives two BO motors.</desc><defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#1f2328}
.th{font-size:14px;font-weight:600;fill:#1f2328}
.ts{font-size:12px;fill:#59636e}
.ti{font-size:16px;font-weight:600;fill:#1f2328}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.ghost{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:6 4}
.w{stroke:#444;stroke-width:1.5;fill:none}
.p{stroke:#D85A30;stroke-width:1.5;fill:none}
</style><rect x="0.5" y="0.5" width="679" height="555" rx="12" fill="#ffffff" stroke="#d0d7de"/><text class="ti" x="24" y="28">Line follower car: system block diagram</text><g transform="translate(0,44)"><rect class="coral" x="30" y="40" width="120" height="56" rx="8"/><text class="th" x="90.0" y="55" text-anchor="middle" dominant-baseline="central">Li-ion ×2</text><text class="ts" x="90.0" y="72" text-anchor="middle" dominant-baseline="central">7.4 V pack</text><line class="w" x1="90" y1="96" x2="90" y2="126" marker-end="url(#ag)"/><rect class="coral" x="30" y="128" width="120" height="44" rx="8"/><text class="th" x="90.0" y="150.0" text-anchor="middle" dominant-baseline="central">Switch</text><line class="w" x1="150" y1="150" x2="178" y2="150" marker-end="url(#ag)"/><rect class="teal" x="30" y="206" width="120" height="44" rx="8"/><text class="th" x="90.0" y="221" text-anchor="middle" dominant-baseline="central">IR module L</text><text class="ts" x="90.0" y="238" text-anchor="middle" dominant-baseline="central">VCC, GND, DO</text><rect class="teal" x="30" y="296" width="120" height="44" rx="8"/><text class="th" x="90.0" y="311" text-anchor="middle" dominant-baseline="central">IR module R</text><text class="ts" x="90.0" y="328" text-anchor="middle" dominant-baseline="central">VCC, GND, DO</text><line class="w" x1="150" y1="228" x2="178" y2="228" marker-end="url(#ag)"/><line class="w" x1="150" y1="318" x2="178" y2="318" marker-end="url(#ag)"/><rect class="ghost" x="180" y="40" width="240" height="332" rx="8"/><text class="th" x="300" y="56" text-anchor="middle" dominant-baseline="central">Perfboard</text><rect class="teal" x="196" y="72" width="160" height="44" rx="8"/><text class="th" x="276.0" y="87" text-anchor="middle" dominant-baseline="central">555 PWM</text><text class="ts" x="276.0" y="104" text-anchor="middle" dominant-baseline="central">trim pot sets speed</text><rect class="coral" x="196" y="128" width="160" height="44" rx="8"/><text class="th" x="276.0" y="143" text-anchor="middle" dominant-baseline="central">Terminal + 7805</text><text class="ts" x="276.0" y="160" text-anchor="middle" dominant-baseline="central">5 V rail, caps</text><rect class="teal" x="196" y="206" width="160" height="44" rx="8"/><text class="th" x="276.0" y="221" text-anchor="middle" dominant-baseline="central">IR header L</text><text class="ts" x="276.0" y="238" text-anchor="middle" dominant-baseline="central">DO_L pad</text><rect class="teal" x="196" y="296" width="160" height="44" rx="8"/><text class="th" x="276.0" y="311" text-anchor="middle" dominant-baseline="central">IR header R</text><text class="ts" x="276.0" y="328" text-anchor="middle" dominant-baseline="central">DO_R pad</text><text class="ts" x="412" y="90" text-anchor="end" dominant-baseline="central">BAT+</text><line class="p" x1="420" y1="90" x2="478" y2="90" marker-end="url(#ap)"/><text class="ts" x="412" y="126" text-anchor="end" dominant-baseline="central">GND</text><line class="w" x1="420" y1="126" x2="478" y2="126" marker-end="url(#ag)"/><text class="ts" x="412" y="162" text-anchor="end" dominant-baseline="central">DO_L</text><line class="w" x1="420" y1="162" x2="478" y2="162" marker-end="url(#ag)"/><text class="ts" x="412" y="198" text-anchor="end" dominant-baseline="central">DO_R</text><line class="w" x1="420" y1="198" x2="478" y2="198" marker-end="url(#ag)"/><text class="ts" x="412" y="234" text-anchor="end" dominant-baseline="central">PWM</text><line class="w" x1="420" y1="234" x2="478" y2="234" marker-end="url(#ag)"/><text class="ts" x="412" y="270" text-anchor="end" dominant-baseline="central">PWM</text><line class="w" x1="420" y1="270" x2="478" y2="270" marker-end="url(#ag)"/><rect class="gray" x="480" y="40" width="170" height="300" rx="8"/><text class="th" x="565" y="58" text-anchor="middle" dominant-baseline="central">L293D board</text><text class="ts" x="490" y="90" text-anchor="start" dominant-baseline="central">V+ / Vcc</text><text class="ts" x="490" y="126" text-anchor="start" dominant-baseline="central">GND</text><text class="ts" x="490" y="162" text-anchor="start" dominant-baseline="central">A1</text><text class="ts" x="490" y="198" text-anchor="start" dominant-baseline="central">B1</text><text class="ts" x="490" y="234" text-anchor="start" dominant-baseline="central">ENA</text><text class="ts" x="490" y="270" text-anchor="start" dominant-baseline="central">ENB</text><text class="ts" x="565" y="304" text-anchor="middle" dominant-baseline="central">A2, B2 tied to GND</text><text class="ts" x="565" y="322" text-anchor="middle" dominant-baseline="central">Vcc node = battery</text><path class="w" d="M520 340 V410 H432" marker-end="url(#ag)"/><path class="w" d="M600 340 V470 H432" marker-end="url(#ag)"/><rect class="gray" x="280" y="388" width="150" height="44" rx="8"/><text class="th" x="355.0" y="403" text-anchor="middle" dominant-baseline="central">Left motor</text><text class="ts" x="355.0" y="420" text-anchor="middle" dominant-baseline="central">OUT1, OUT2</text><rect class="gray" x="280" y="448" width="150" height="44" rx="8"/><text class="th" x="355.0" y="463" text-anchor="middle" dominant-baseline="central">Right motor</text><text class="ts" x="355.0" y="480" text-anchor="middle" dominant-baseline="central">OUT3, OUT4</text></g></svg>