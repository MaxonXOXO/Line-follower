<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img"><title>555 PWM wiring</title><desc>Pin map of the 555 with each pin's connection, plus the diode-steered timing network with R1, two 1N4007 diodes, a 100 kilo-ohm trim pot and capacitors. Pin 3 is the PWM output to ENA and ENB.</desc><defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#1f2328}
.th{font-size:14px;font-weight:600;fill:#1f2328}
.ts{font-size:12px;fill:#59636e}
.ti{font-size:16px;font-weight:600;fill:#1f2328}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.ghost{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:6 4}
.w{stroke:#444;stroke-width:1.5;fill:none}
.p{stroke:#D85A30;stroke-width:1.5;fill:none}
</style><rect x="0.5" y="0.5" width="679" height="619" rx="12" fill="#ffffff" stroke="#d0d7de"/><text class="ti" x="24" y="28">555 PWM speed control: pins and timing network</text><g transform="translate(0,44)"><rect class="teal" x="290" y="60" width="100" height="228" rx="8"/><text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">555</text><line class="w" x1="270" y1="90" x2="290" y2="90"/><line class="w" x1="390" y1="90" x2="410" y2="90"/><line class="w" x1="270" y1="146" x2="290" y2="146"/><line class="w" x1="390" y1="146" x2="410" y2="146"/><line class="w" x1="270" y1="202" x2="290" y2="202"/><line class="w" x1="390" y1="202" x2="410" y2="202"/><line class="w" x1="270" y1="258" x2="290" y2="258"/><line class="w" x1="390" y1="258" x2="410" y2="258"/><text class="ts" x="296" y="90" text-anchor="start" dominant-baseline="central">1 GND</text><text class="ts" x="384" y="90" text-anchor="end" dominant-baseline="central">VCC 8</text><text class="ts" x="296" y="146" text-anchor="start" dominant-baseline="central">2 TRG</text><text class="ts" x="384" y="146" text-anchor="end" dominant-baseline="central">DIS 7</text><text class="ts" x="296" y="202" text-anchor="start" dominant-baseline="central">3 OUT</text><text class="ts" x="384" y="202" text-anchor="end" dominant-baseline="central">THR 6</text><text class="ts" x="296" y="258" text-anchor="start" dominant-baseline="central">4 RST</text><text class="ts" x="384" y="258" text-anchor="end" dominant-baseline="central">CTL 5</text><line class="w" x1="215" y1="90" x2="270" y2="90"/><line class="w" x1="215" y1="146" x2="270" y2="146"/><line class="w" x1="270" y1="202" x2="217" y2="202" marker-end="url(#ag)"/><line class="w" x1="215" y1="258" x2="270" y2="258"/><line class="w" x1="410" y1="90" x2="465" y2="90"/><line class="w" x1="410" y1="146" x2="465" y2="146"/><line class="w" x1="410" y1="202" x2="465" y2="202"/><line class="w" x1="410" y1="258" x2="465" y2="258"/><rect class="gray" x="30" y="68" width="185" height="44" rx="8"/><text class="th" x="122.5" y="90.0" text-anchor="middle" dominant-baseline="central">GND</text><rect class="gray" x="30" y="124" width="185" height="44" rx="8"/><text class="th" x="122.5" y="139" text-anchor="middle" dominant-baseline="central">Node W</text><text class="ts" x="122.5" y="156" text-anchor="middle" dominant-baseline="central">trim wiper, C1 to GND</text><rect class="gray" x="30" y="180" width="185" height="44" rx="8"/><text class="th" x="122.5" y="195" text-anchor="middle" dominant-baseline="central">ENA + ENB</text><text class="ts" x="122.5" y="212" text-anchor="middle" dominant-baseline="central">PWM to the L293D</text><rect class="coral" x="30" y="236" width="185" height="44" rx="8"/><text class="th" x="122.5" y="251" text-anchor="middle" dominant-baseline="central">+5 V</text><text class="ts" x="122.5" y="268" text-anchor="middle" dominant-baseline="central">reset held high</text><rect class="coral" x="465" y="68" width="185" height="44" rx="8"/><text class="th" x="557.5" y="83" text-anchor="middle" dominant-baseline="central">+5 V</text><text class="ts" x="557.5" y="100" text-anchor="middle" dominant-baseline="central">0.1 µF to GND</text><rect class="gray" x="465" y="124" width="185" height="44" rx="8"/><text class="th" x="557.5" y="139" text-anchor="middle" dominant-baseline="central">Node D</text><text class="ts" x="557.5" y="156" text-anchor="middle" dominant-baseline="central">1 kΩ to 5 V, D1, D2</text><rect class="gray" x="465" y="180" width="185" height="44" rx="8"/><text class="th" x="557.5" y="195" text-anchor="middle" dominant-baseline="central">Node W</text><text class="ts" x="557.5" y="212" text-anchor="middle" dominant-baseline="central">same node as pin 2</text><rect class="gray" x="465" y="236" width="185" height="44" rx="8"/><text class="th" x="557.5" y="251" text-anchor="middle" dominant-baseline="central">C2 10 nF</text><text class="ts" x="557.5" y="268" text-anchor="middle" dominant-baseline="central">pin 5 to GND</text><text class="ts" x="340" y="322" text-anchor="middle" dominant-baseline="central">Timing network (sets duty cycle, C1 = 10 nF)</text><rect class="gray" x="110" y="340" width="130" height="44" rx="8"/><text class="th" x="175.0" y="355" text-anchor="middle" dominant-baseline="central">D1 1N4007</text><text class="ts" x="175.0" y="372" text-anchor="middle" dominant-baseline="central">stripe to pot</text><rect class="gray" x="265" y="340" width="150" height="44" rx="8"/><text class="th" x="340.0" y="355" text-anchor="middle" dominant-baseline="central">Node D</text><text class="ts" x="340.0" y="372" text-anchor="middle" dominant-baseline="central">pin 7, 1 kΩ to 5 V</text><rect class="gray" x="440" y="340" width="130" height="44" rx="8"/><text class="th" x="505.0" y="355" text-anchor="middle" dominant-baseline="central">D2 1N4007</text><text class="ts" x="505.0" y="372" text-anchor="middle" dominant-baseline="central">stripe to pin 7</text><line class="w" x1="265" y1="362" x2="242" y2="362" marker-end="url(#ag)"/><line class="w" x1="440" y1="362" x2="417" y2="362" marker-end="url(#ag)"/><line class="w" x1="175" y1="384" x2="175" y2="428" marker-end="url(#ag)"/><line class="w" x1="505" y1="430" x2="505" y2="386" marker-end="url(#ag)"/><rect class="gray" x="120" y="430" width="440" height="44" rx="8"/><text class="th" x="340" y="452" text-anchor="middle" dominant-baseline="central">Trim pot 100 kΩ</text><text class="ts" x="140" y="452" text-anchor="middle" dominant-baseline="central">A</text><text class="ts" x="540" y="452" text-anchor="middle" dominant-baseline="central">B</text><line class="w" x1="340" y1="474" x2="340" y2="510" marker-end="url(#ag)"/><text class="ts" x="348" y="494" text-anchor="start" dominant-baseline="central">wiper</text><rect class="gray" x="240" y="512" width="200" height="44" rx="8"/><text class="th" x="340.0" y="527" text-anchor="middle" dominant-baseline="central">Node W</text><text class="ts" x="340.0" y="544" text-anchor="middle" dominant-baseline="central">pins 2 + 6, C1 to GND</text></g></svg>